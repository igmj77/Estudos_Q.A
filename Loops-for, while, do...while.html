<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loops em JavaScript</title>
</head>
<body>
    <h1>Exercícios com loops</h1>
    <script>
        // Exemplo com for: imprimir número de 1 a 10
        for (let i = 1; i <= 10; i++) {
            console.log("Número: " + i);
        }
        // Exemplo com While: somar números de 1 a 100
        let soma = 0;
        let s = 1;
        while (s <= 100) {
            soma += s;
            s++;
        }
        alert("soma de 1 a 100: " + soma)

        // Exemplo com Do...While: imprime pelo menos uma vez
        let p = 0;
        do {
            console.log("Executando pelo menos uma vez. Valor de p: "+ p);
            p++;
        } while (p < 3);
    </script>
</body>
</html>
