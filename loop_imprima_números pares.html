<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números Pares</title>
</head>
<body>
    <h1>Números Pares</h1>
    <script>
        console.log("Números Pares!");

        for(let i = 1; i <= 20; i++) {
            if(i % 2 === 0) {
                console.log(i);
            }
        }
        // imorimir na tela
        document.write("Resultado! ");

        for(let i = 1; i <=20; i++) {
            if(i % 2 === 0) {
                document.write(i + '');
            }
        }
    </script>
</body>
</html>
