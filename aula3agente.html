<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops</title>
</head>
<body>
    <h1>Exercícos com Loops</h1>
    <script>
        // imprimir números de 1 a 10
        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }
        // Soma de 1 a 100
        let soma = 0;
        let j = 1;
        while(j <= 10) {
            soma += j;
            j++; 
        }
        alert("Soma de 1 a 100: " + soma);
    </script>
</body>
</html>
