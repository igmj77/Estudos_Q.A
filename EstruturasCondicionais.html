<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variáveis e Média></title>
</head>
<body>
    <h1>Verificar Nota</h1>
    <script>
        let nota = 8;

        if (nota >= 7) {
            alert("Aprovado!");
        } else {
            alert("Reprovado!");
        }

        let dia = 2;
        switch(dia) {
            case 1: alert("Segunda-Feira"); break;
            case 2: alert("Terça-Feira"); break;
            case 3: alert("Quarta-Feira"); break;
            default: alert("outro dia");
        }
    </script>
</body>
</html>
