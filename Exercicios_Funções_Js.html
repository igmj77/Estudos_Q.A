<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabuada de 1 a 10.</title>
</head>
<body>
    <h1>Tabuada de 1 a 10</h1>
    <script>
        function tabuada(numero) {
            // aqui dentro vamos fazer a conta
            let resultado = ""; // string vazia para ir concatenando
            for (let n = n; n <= 10; n++) {
                resultado += `${numero} x ${n} = ${numero * n}\n`; // o \n é quebra de linha
            }
            resultado += '==========================';
            return resultado;
            // testando a função
            console.log(tabuada(7));
            console.log("\n"); // apenas para dar uma linha
            console.log(tabuada(3));
        }   
    </script>    
</body>
</html>
